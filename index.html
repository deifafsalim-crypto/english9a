<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>English for Me 9A — منصة التعلم التفاعلية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F7F5; --surface:#FFFFFF; --surface2:#F7FAF9; --ink:#2E3A55; --muted:#66718A; --line:#DDE8E4;
  --u1:#6FC9AE; --u2:#A594E0; --u3:#EDBF52; --u4:#74B2E6; --cc:#F09E82;
  --good:#3FB483; --bad:#E7887A; --sun:#FFD95A; --sunInk:#8A6400;
  --shadow:0 10px 30px -12px rgba(46,58,85,.22);
  --font:"Baloo Bhaijaan 2","Tahoma","Segoe UI",system-ui,sans-serif;
  --spring:cubic-bezier(.34,1.56,.64,1);
  --ease:cubic-bezier(.22,.8,.26,1);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1B2232; --surface:#252E42; --surface2:#2B354B; --ink:#E8EDF6; --muted:#A5B0C6; --line:#36425C;
    --shadow:0 10px 30px -12px rgba(0,0,0,.5); --sunInk:#FFE9A6; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1B2232; --surface:#252E42; --surface2:#2B354B; --ink:#E8EDF6; --muted:#A5B0C6; --line:#36425C;
  --shadow:0 10px 30px -12px rgba(0,0,0,.5); --sunInk:#FFE9A6; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.7;
  background-image:radial-gradient(color-mix(in srgb,var(--u1) 18%,transparent) 1.4px,transparent 1.6px);background-size:26px 26px;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,a:focus-visible{outline:3px solid var(--u4);outline-offset:3px;border-radius:14px}
.en{direction:ltr;text-align:left;unicode-bidi:isolate}
.ar{direction:rtl;text-align:right}
.wrap{max-width:980px;margin:0 auto;padding:0 18px 80px}

/* ---- top bar ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:12px 0}
.bar{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-radius:999px;padding:6px 8px 6px 14px;box-shadow:var(--shadow);max-width:980px;margin:0 auto}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;white-space:nowrap;direction:ltr;padding:4px 8px;border-radius:999px}
.brand .dot{font-size:13px;background:var(--sun);color:#6B4E00;border-radius:999px;padding:0 10px;font-weight:800}
.spacer{flex:1}
.pill{display:flex;align-items:center;gap:6px;background:var(--surface2);border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;font-size:18px;transition:transform .3s var(--spring)}
.iconbtn:active{transform:scale(.9)}

/* ---- buttons ---- */
.btn{--c:var(--u1);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 24px;border-radius:999px;font-weight:800;font-size:17px;
  background:var(--c);color:#1F2B40;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 65%,#000);transition:transform .15s var(--ease),box-shadow .15s var(--ease)}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 color-mix(in srgb,var(--c) 65%,#000)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 65%,#000)}
.btn.ghost{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.small{padding:8px 16px;font-size:15px}
.btn[disabled]{opacity:.5;pointer-events:none}

/* ---- mascot ---- */
.mascot{width:120px;height:120px;flex:none;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}

/* ---- home ---- */
.hero{display:flex;align-items:center;gap:22px;background:var(--surface);border-radius:32px;padding:26px 28px;box-shadow:var(--shadow);margin-top:10px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -40px -60px auto;width:220px;height:220px;border-radius:50%;background:color-mix(in srgb,var(--sun) 35%,transparent)}
.hero h1{margin:0;font-size:clamp(26px,4.6vw,40px);line-height:1.2}
.hero p{margin:6px 0 14px;color:var(--muted)}
.hero .row{display:flex;gap:10px;flex-wrap:wrap;position:relative;z-index:1}
.progressline{height:14px;border-radius:999px;background:var(--surface2);overflow:hidden;margin:6px 0 4px;box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.progressline span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--u1),var(--u4));transition:width .8s var(--ease)}
.h2{font-size:24px;margin:34px 4px 14px;display:flex;align-items:center;gap:10px}
.h2 small{font-size:15px;color:var(--muted);font-weight:500}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
.unit{--c:var(--u1);text-align:right;background:var(--surface);border-radius:28px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden;
  transition:transform .35s var(--spring);display:flex;flex-direction:column;gap:6px;min-height:180px}
.unit:hover{transform:translateY(-4px) rotate(-.6deg)}
.unit .blob{position:absolute;left:-28px;top:-28px;width:120px;height:120px;border-radius:44% 56% 60% 40%/50% 45% 55% 50%;background:color-mix(in srgb,var(--c) 30%,transparent)}
.unit .num{width:52px;height:52px;border-radius:18px;background:var(--c);display:grid;place-items:center;font-size:26px;font-weight:800;color:#1F2B40;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 65%,#000)}
.unit .t{font-size:22px;font-weight:800;line-height:1.2;margin-top:6px}
.unit .s{color:var(--muted);font-size:15px}
.unit .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.unit .ico{position:absolute;left:18px;top:16px;font-size:34px}
.examcard{margin-top:22px;display:flex;align-items:center;gap:18px;border-radius:28px;padding:22px 24px;background:linear-gradient(120deg,color-mix(in srgb,var(--u2) 45%,var(--surface)),color-mix(in srgb,var(--u4) 45%,var(--surface)));box-shadow:var(--shadow)}
.examcard .big{font-size:48px}
.examcard h3{margin:0;font-size:22px}
.examcard p{margin:2px 0 0;color:var(--ink);opacity:.8}

/* ---- unit path ---- */
.backrow{display:flex;align-items:center;gap:12px;margin:10px 0 6px}
.unithead{--c:var(--u1);background:color-mix(in srgb,var(--c) 26%,var(--surface));border-radius:32px;padding:22px 26px;display:flex;gap:16px;align-items:center}
.unithead .num{width:64px;height:64px;font-size:32px}
.unithead h1{margin:0;font-size:clamp(24px,4vw,34px);line-height:1.15}
.unithead p{margin:2px 0 0;color:var(--muted)}
.path{position:relative;padding:26px 0 10px;display:flex;flex-direction:column;gap:14px}
.path::before{content:"";position:absolute;top:30px;bottom:30px;right:50%;border-right:4px dashed color-mix(in srgb,var(--c) 60%,transparent)}
.stone{position:relative;display:flex;align-items:center;gap:16px;width:min(470px,90%);background:var(--surface);border-radius:26px;padding:14px 18px;box-shadow:var(--shadow);text-align:right;transition:transform .35s var(--spring)}
.stone:nth-child(odd){align-self:flex-start;margin-right:4%}
.stone:nth-child(even){align-self:flex-end;margin-left:4%}
.stone:hover{transform:scale(1.03)}
.stone .n{width:54px;height:54px;flex:none;border-radius:50%;background:var(--c);display:grid;place-items:center;font-weight:800;font-size:22px;color:#1F2B40;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 65%,#000)}
.stone .t{font-weight:800;font-size:18px;line-height:1.25}
.stone .s{color:var(--muted);font-size:14px}
.stars{letter-spacing:2px;font-size:15px;white-space:nowrap}
.stars .off{opacity:.25;filter:grayscale(1)}

/* ---- lesson ---- */
.lessonhead{--c:var(--u1);background:var(--surface);border-radius:30px;padding:20px 24px;box-shadow:var(--shadow);border-top:8px solid var(--c)}
.lessonhead h1{margin:0;font-size:clamp(22px,3.8vw,32px);line-height:1.2}
.lessonhead .sub{color:var(--muted);margin-top:2px}
.pg{display:inline-block;background:color-mix(in srgb,var(--c) 30%,var(--surface));border-radius:999px;padding:0 12px;font-size:14px;font-weight:700;margin-bottom:6px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.tab{background:var(--surface);border-radius:20px;padding:10px 6px;font-weight:800;font-size:16px;box-shadow:0 4px 0 var(--line);display:flex;flex-direction:column;align-items:center;line-height:1.3;transition:transform .2s var(--ease)}
.tab small{font-weight:500;color:var(--muted);font-size:13px}
.tab.on{background:var(--c);color:#1F2B40;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 65%,#000)}
.tab.on small{color:#2E3A55}
.tab .ok{font-size:13px}
.panel{background:var(--surface);border-radius:30px;padding:22px;box-shadow:var(--shadow)}
.intro{background:color-mix(in srgb,var(--sun) 30%,var(--surface));border-radius:20px;padding:12px 16px;display:flex;gap:12px;align-items:center;margin-bottom:16px}
.intro .mini{width:48px;height:48px;flex:none}
.block{border-radius:22px;padding:16px 18px;margin:12px 0;background:var(--surface2)}
.block .enp{font-size:18px;margin:0}
.block .arp{margin:8px 0 0;color:var(--muted);border-top:2px dashed var(--line);padding-top:8px}
.block b{color:var(--ink)}
.tip{background:color-mix(in srgb,var(--c) 20%,var(--surface));display:flex;gap:10px}
.tip .i{font-size:24px}
.tablewrap{overflow-x:auto;border-radius:18px;background:var(--surface);direction:ltr}
table{border-collapse:collapse;width:100%;min-width:360px;font-size:16px}
th{background:color-mix(in srgb,var(--c) 35%,var(--surface));padding:8px 12px;text-align:left;font-weight:800}
td{padding:8px 12px;border-top:1px solid var(--line)}
td:has(+td),th:has(+th){}
.exlist{display:flex;flex-direction:column;gap:8px}
.ex{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border-radius:16px;padding:10px 12px}
.ex .say{flex:none}
.ex .e{font-weight:600}
.ex .a{color:var(--muted);font-size:15px}
.say{width:36px;height:36px;border-radius:50%;background:color-mix(in srgb,var(--u4) 30%,var(--surface));display:grid;place-items:center;font-size:16px;transition:transform .25s var(--spring)}
.say:active{transform:scale(.85)}
.nextbar{display:flex;justify-content:center;margin-top:20px;gap:10px;flex-wrap:wrap}

/* ---- games ---- */
.ghead{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.ghead h2{margin:0;font-size:22px;direction:ltr;text-align:right}
.ghead p{margin:0;color:var(--muted)}
.gbody{direction:ltr}
.dots{display:flex;gap:6px;justify-content:center;margin:4px 0 16px;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line);transition:all .3s var(--spring)}
.dots i.done{background:var(--good)}
.dots i.cur{background:var(--c);transform:scale(1.35)}
.sentence{font-size:clamp(19px,3vw,24px);font-weight:600;text-align:center;padding:18px;background:var(--surface2);border-radius:22px;margin-bottom:18px;line-height:1.6}
.blank{display:inline-block;min-width:90px;border-bottom:4px solid var(--c);color:var(--good);font-weight:800;padding:0 6px}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{background:var(--surface);border-radius:18px;padding:10px 18px;font-weight:700;font-size:18px;box-shadow:0 4px 0 var(--line),0 0 0 2px var(--line) inset;transition:transform .2s var(--spring),background .2s,opacity .2s;min-height:48px}
.chip:hover{transform:translateY(-2px)}
.chip:active{transform:translateY(3px)}
.chip.good{background:color-mix(in srgb,var(--good) 30%,var(--surface));box-shadow:0 4px 0 var(--good),0 0 0 2px var(--good) inset}
.chip.bad{background:color-mix(in srgb,var(--bad) 28%,var(--surface));box-shadow:0 4px 0 var(--bad),0 0 0 2px var(--bad) inset;animation:shake .4s}
.chip.sel{background:color-mix(in srgb,var(--c) 40%,var(--surface));box-shadow:0 4px 0 color-mix(in srgb,var(--c) 70%,#000),0 0 0 2px var(--c) inset;transform:translateY(-3px)}
.chip.used{opacity:.25;pointer-events:none}
.chip.block{width:100%;text-align:left;font-size:17px}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.shake{animation:shake .4s}
.sortcard{margin:0 auto 18px;max-width:420px;background:var(--surface2);border-radius:26px;padding:22px;text-align:center;font-size:clamp(20px,3.4vw,26px);font-weight:800;box-shadow:0 0 0 3px var(--c) inset;display:flex;align-items:center;justify-content:center;gap:12px;min-height:96px}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.bucket{background:color-mix(in srgb,var(--c) 14%,var(--surface));border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:130px;text-align:center;transition:transform .25s var(--spring)}
.bucket .bt{font-weight:800;font-size:18px;background:var(--surface);border-radius:14px;padding:8px;box-shadow:0 4px 0 var(--line)}
.bucket:hover .bt{transform:translateY(-2px)}
.bucket .in{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.bucket .in span{background:var(--surface);border-radius:10px;padding:0 8px;font-size:14px}
.bucket.pop{transform:scale(1.05)}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.matchcol{display:flex;flex-direction:column;gap:10px}
.matchcol .chip{font-size:16px;text-align:left;line-height:1.35}
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{display:block;width:100%;aspect-ratio:1/1.05;perspective:700px;border-radius:18px;padding:0}
.card .inner{display:block;position:relative;width:100%;height:100%;transition:transform .5s var(--ease);transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;padding:6px;text-align:center}
.card .f{background:var(--c);font-size:30px;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 65%,#000)}
.card .b{background:var(--surface2);transform:rotateY(180deg);font-weight:700;font-size:clamp(12px,2.2vw,16px);line-height:1.25;box-shadow:0 0 0 2px var(--line) inset}
.card.matched .b{background:color-mix(in srgb,var(--good) 30%,var(--surface));box-shadow:0 0 0 2px var(--good) inset}
.answerline{min-height:64px;background:var(--surface2);border-radius:20px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin-bottom:14px;border:3px dashed var(--line)}
.answerline.col{flex-direction:column;align-items:stretch}
.answerline .ph{color:var(--muted);font-size:15px}
.chips.col{flex-direction:column;align-items:stretch}
.passage{font-size:19px;line-height:2.3;background:var(--surface2);border-radius:22px;padding:18px;margin-bottom:16px}
.gapbtn{display:inline-block;min-width:88px;padding:0 10px;border-radius:12px;background:var(--surface);box-shadow:0 0 0 2px var(--line) inset;font-weight:800;line-height:1.8;margin:0 2px;vertical-align:baseline;color:var(--muted)}
.gapbtn.active{box-shadow:0 0 0 3px var(--c) inset;background:color-mix(in srgb,var(--c) 18%,var(--surface))}
.gapbtn.filled{color:var(--good);box-shadow:0 0 0 2px var(--good) inset;background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.hintar{direction:rtl;text-align:center;color:var(--muted);margin:-6px 0 12px}
.donebox{text-align:center;padding:10px}
.donebox .big{font-size:60px;line-height:1}
.donebox h3{font-size:26px;margin:6px 0}

/* ---- quiz ---- */
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;font-weight:700;color:var(--muted)}
.qtext{font-size:clamp(19px,3vw,24px);font-weight:700;margin:6px 0 16px;direction:ltr;text-align:left}
.opts{display:flex;flex-direction:column;gap:10px;direction:ltr}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface2);border-radius:20px;padding:12px 16px;font-size:18px;font-weight:600;box-shadow:0 4px 0 var(--line);transition:transform .2s var(--spring),background .2s}
.opt:hover{transform:translateX(4px)}
.opt .L{width:34px;height:34px;flex:none;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:800}
.opt.good{background:color-mix(in srgb,var(--good) 28%,var(--surface));box-shadow:0 4px 0 var(--good)}
.opt.bad{background:color-mix(in srgb,var(--bad) 28%,var(--surface));box-shadow:0 4px 0 var(--bad);animation:shake .4s}
.opt[disabled]{cursor:default}
.feedback{margin-top:14px;border-radius:18px;padding:12px 16px;display:flex;gap:10px;align-items:flex-start}
.feedback.good{background:color-mix(in srgb,var(--good) 18%,var(--surface))}
.feedback.bad{background:color-mix(in srgb,var(--bad) 18%,var(--surface))}
.score{font-size:64px;font-weight:800;line-height:1;margin:6px 0}
.review{text-align:right;margin-top:16px;display:flex;flex-direction:column;gap:8px}
.review .r{background:var(--surface2);border-radius:16px;padding:10px 14px}
.review .r .q{direction:ltr;text-align:left;font-weight:700}
.review .r .c{direction:ltr;text-align:left;color:var(--good);font-weight:700}
.bars{display:flex;flex-direction:column;gap:8px;margin:16px auto;max-width:520px;text-align:right}
.barrow{display:grid;grid-template-columns:140px 1fr 48px;gap:10px;align-items:center;font-size:15px}
.barrow .track{height:14px;border-radius:999px;background:var(--surface2);overflow:hidden}
.barrow .track span{display:block;height:100%;border-radius:999px}

/* ---- toast & confetti ---- */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);z-index:40;background:var(--surface);border-radius:999px;padding:8px 20px 8px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 14px 40px -10px rgba(46,58,85,.45);font-weight:800;font-size:17px;transition:transform .45s var(--spring),opacity .3s;white-space:nowrap;opacity:0;visibility:hidden}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.toast svg{width:40px;height:40px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;width:10px;height:14px;border-radius:3px;animation:fly 1.1s var(--ease) forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}
.fade{animation:fadein .45s var(--ease)}
@keyframes fadein{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

@media (max-width:640px){
  body{font-size:16px}
  .hero{flex-direction:column;text-align:center;padding:22px 18px}
  .hero .row{justify-content:center}
  .mascot{width:96px;height:96px}
  .stone{width:100%;margin:0!important}
  .path::before{right:40px}
  .memgrid{grid-template-columns:repeat(3,1fr)}
  .matchcol .chip{font-size:14px;padding:8px 10px}
  .panel{padding:16px}
  .brand{font-size:16px;gap:6px}
  .barrow{grid-template-columns:100px 1fr 40px}
  .examcard{flex-direction:column;text-align:center}
}

/* ===== v2: pictures, chat, new games ===== */
.iconbtn.on{background:color-mix(in srgb,var(--u2) 45%,var(--surface));animation:bob 1.6s ease-in-out infinite}
.unit .art{position:absolute;left:10px;top:10px;width:96px;height:72px}
.unit .art svg,.headart svg{width:100%;height:100%}
.headart{width:130px;height:96px;flex:none}
.stone .n{font-size:28px}
.lessonhead{position:relative;overflow:hidden;padding:0;border-top:0}
.scene{position:relative;height:120px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 55%,var(--surface)),color-mix(in srgb,var(--c) 18%,var(--surface)))}
.scene .fl{position:absolute;font-size:44px;transform:translate(-50%,-50%);animation:floaty 4.5s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(46,58,85,.18))}
@keyframes floaty{0%,100%{transform:translate(-50%,-50%) rotate(-6deg)}50%{transform:translate(-50%,-72%) rotate(6deg)}}
.lhtext{padding:14px 24px 18px}
h3.sec{margin:22px 4px 12px;font-size:20px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
h3.sec small{font-size:14px;color:var(--muted);font-weight:500}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:12px}
.pc{perspective:800px;height:150px;padding:0;border-radius:22px}
.pc .pin{display:block;position:relative;width:100%;height:100%;transition:transform .55s var(--spring);transform-style:preserve-3d}
.pc.flip .pin{transform:rotateY(180deg)}
.pc .pf,.pc .pb{position:absolute;inset:0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:8px}
.pc .pf{background:var(--surface2);box-shadow:0 5px 0 var(--line),0 0 0 2px var(--line) inset}
.pc .pb{background:color-mix(in srgb,var(--c) 35%,var(--surface));transform:rotateY(180deg);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 65%,#000)}
.pc .em{font-size:52px;line-height:1.1}
.pc .em.sm{font-size:30px}
.pc .w{font-weight:800;font-size:18px;text-align:center}
.pc .m{font-weight:700;font-size:17px;color:var(--ink)}
.pc:hover .pf{transform:translateY(-3px)}
.chat{display:flex;flex-direction:column;gap:12px}
.msg{display:none;gap:10px;align-items:flex-start}
.msg.show{display:flex;animation:pop .45s var(--spring)}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(10px)}to{opacity:1;transform:none}}
.msg .av{flex:none;width:44px;height:44px}
.msg .av .mascot{animation:none}
.bub{flex:1;min-width:0;background:var(--surface2);border-radius:22px 6px 22px 22px;padding:14px 16px;box-shadow:0 3px 0 var(--line)}
.bub .enp{font-size:18px;margin:0}
.bub .arp{margin:8px 0 0;color:var(--muted);border-top:2px dashed var(--line);padding-top:8px}
.tipin{display:flex;gap:10px;background:color-mix(in srgb,var(--c) 22%,var(--surface));border-radius:16px;padding:10px 12px}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px;direction:rtl}
.lv{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:18px;padding:8px 10px;text-align:right;box-shadow:0 3px 0 var(--line);position:relative;line-height:1.2}
.lv .li{font-size:26px}
.lv b{display:block;font-size:14px}
.lv small{display:block;font-size:12px;color:var(--muted);text-align:right}
.lv.on{background:color-mix(in srgb,var(--c) 40%,var(--surface));box-shadow:0 3px 0 color-mix(in srgb,var(--c) 65%,#000)}
.lv .ck{position:absolute;top:-6px;left:-4px;background:var(--good);color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:12px}
.card .b.bigem{font-size:clamp(30px,6vw,46px)}
.listenbox{text-align:center;margin-bottom:10px}
.bigsay{width:96px;height:96px;border-radius:50%;font-size:44px;background:var(--c);box-shadow:0 6px 0 color-mix(in srgb,var(--c) 65%,#000);animation:pulse 1.8s ease-in-out infinite}
.bigsay:active{transform:translateY(4px)}
@keyframes pulse{50%{box-shadow:0 6px 0 color-mix(in srgb,var(--c) 65%,#000),0 0 0 14px color-mix(in srgb,var(--c) 22%,transparent)}}
.picopts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.picopt{font-size:clamp(40px,8vw,64px);background:var(--surface2);border-radius:24px;aspect-ratio:1;box-shadow:0 5px 0 var(--line),0 0 0 2px var(--line) inset;transition:transform .2s var(--spring)}
.picopt:hover{transform:translateY(-4px) rotate(-3deg)}
.picopt.good{background:color-mix(in srgb,var(--good) 30%,var(--surface));box-shadow:0 5px 0 var(--good),0 0 0 3px var(--good) inset;transform:scale(1.08)}
.picopt.bad{opacity:.35;animation:shake .4s}
.prompt{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 auto 14px;background:var(--surface2);border-radius:24px;padding:10px 20px;width:fit-content}
.prompt .em{font-size:64px;line-height:1.1}
.prompt .pm{font-size:20px;font-weight:700;direction:rtl}
.sky{position:relative;height:320px;border-radius:26px;overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--u4) 40%,var(--surface)),color-mix(in srgb,var(--u4) 10%,var(--surface)))}
.cloud{position:absolute;font-size:46px;opacity:.7;pointer-events:none}
.balloon{position:absolute;bottom:40px;width:22%;max-width:130px;aspect-ratio:.85;border-radius:50% 50% 48% 48%/55% 55% 45% 45%;background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.7) 0 10%,transparent 11%),var(--bc);
  display:grid;place-items:center;font-weight:800;font-size:clamp(13px,2.4vw,18px);color:#1F2B40;padding:6px;animation:balloon 3.4s ease-in-out infinite alternate;transition:transform .25s,opacity .25s;z-index:1;line-height:1.1;word-break:break-word}
.balloon::after{content:"";position:absolute;bottom:-38px;left:50%;width:2px;height:38px;background:color-mix(in srgb,var(--ink) 40%,transparent)}
.balloon::before{content:"";position:absolute;bottom:-6px;left:calc(50% - 6px);border:6px solid transparent;border-bottom:8px solid var(--bc);transform:rotate(180deg)}
@keyframes balloon{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-150px) rotate(4deg)}}
.balloon.popped{animation:none;transform:scale(1.6);opacity:0}
.balloon.away{animation:none;transform:translateY(-400px);opacity:0;transition:transform 1s,opacity 1s}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 16px;direction:ltr}
.slot{width:44px;height:52px;border-radius:12px;border-bottom:4px solid var(--c);background:var(--surface2);display:grid;place-items:center;font-size:26px;font-weight:800;text-transform:lowercase}
.slot.f{background:color-mix(in srgb,var(--good) 22%,var(--surface));animation:pop .3s var(--spring)}
.tile{min-width:52px;font-size:24px}
.rocketwrap{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:12px}
.rk{font-size:64px;transition:transform 1.2s cubic-bezier(.5,0,.8,.2)}
.rk.launch{transform:translate(120px,-420px) scale(.6)}
.fuel{width:22px;height:90px;border-radius:12px;background:var(--surface2);display:flex;align-items:flex-end;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
.fuel span{width:100%;background:linear-gradient(0deg,var(--bad),var(--sun));transition:height .4s var(--ease)}
.keys{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;max-width:560px;margin:0 auto}
.key{aspect-ratio:1;border-radius:12px;background:var(--surface2);font-weight:800;font-size:20px;box-shadow:0 3px 0 var(--line)}
.key.good{background:color-mix(in srgb,var(--good) 35%,var(--surface))}
.key.bad{background:color-mix(in srgb,var(--bad) 35%,var(--surface));opacity:.5}
.timer{height:14px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-bottom:14px}
.timer span{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--bad),var(--sun),var(--good))}
.racecard{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface2);border-radius:26px;padding:18px;max-width:360px;margin:0 auto}
.racecard .em{font-size:84px;line-height:1.1}
.racecard .w{font-size:30px;font-weight:800}
@media (max-width:640px){
  .levels{grid-template-columns:repeat(3,1fr)}
  .lv{flex-direction:column;text-align:center;padding:8px 4px}
  .lv small{text-align:center}
  .picopts{grid-template-columns:repeat(2,1fr)}
  .keys{grid-template-columns:repeat(7,1fr)}
  .headart{display:none}
  .scene .fl{font-size:34px}
  .pics{grid-template-columns:repeat(2,1fr)}
  .balloon{font-size:12px}
}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<script>
/* ===== Units & lessons data — Units 1 & 2 =====
   Authoring rule: in every quiz / gap question the FIRST option is the correct one.
   Options are shuffled when shown. */
const UNITS = [
  { id: 'u1', n: '1', en: 'Teen Time', ar: 'عالم المراهقين', icon: '😊', pages: '1–10' },
  { id: 'u2', n: '2', en: 'Writers and Writing', ar: 'الكُتّاب والكتابة', icon: '📚', pages: '11–20' },
  { id: 'u3', n: '3', en: 'Money', ar: 'المال', icon: '🪙', pages: '21–30' },
  { id: 'u4', n: '4', en: 'Space', ar: 'الفضاء', icon: '🚀', pages: '31–40' },
  { id: 'cc', n: '★', en: 'Club Corner', ar: 'ركن النادي', icon: '⭐', pages: '41–50' }
];

const LESSONS = [];

/* ---------------- UNIT 1 : TEEN TIME ---------------- */
LESSONS.push({
  id: 'u1l1', u: 'u1', title: 'Meet the ITC members', ar: 'تعرّف على أعضاء النادي', pg: '1',
  intro: 'زكريا ونجمة ومصطفى وسوزان وتوم يعرّفون بأنفسهم. نتعلم كيف نقول "لي / له / لها" بالإنجليزي.',
  ex: [
    { t: 'rule', en: '<b>Possessive adjectives</b> come <b>before a noun</b>: my, your, his, her, its, our, their.', ar: 'صفات الملكية تأتي <b>قبل الاسم</b> مباشرة: my book = كتابي.' },
    { t: 'rule', en: '<b>Possessive pronouns</b> stand <b>alone</b> (no noun after them): mine, yours, his, hers, ours, theirs.', ar: 'ضمائر الملكية تأتي <b>وحدها</b> بدون اسم بعدها: The book is mine = الكتاب لي.' },
    { t: 'table', head: ['Subject', 'Adjective + noun', 'Pronoun'], rows: [['I', 'my bag', 'mine'], ['you', 'your bag', 'yours'], ['he', 'his bag', 'his'], ['she', 'her bag', 'hers'], ['it', 'its tail', '—'], ['we', 'our bag', 'ours'], ['they', 'their bag', 'theirs']] },
    { t: 'rule', en: '<b>Possessive apostrophe (\'s)</b> shows who owns something: <i>Najma\'s brother</i>. Plural nouns ending in -s take only an apostrophe: <i>the boys\' bikes</i>.', ar: 'نضيف <b>\'s</b> بعد اسم الشخص لنقول إن الشيء له: Najma\'s brother = أخو نجمة. وإذا كان الاسم جمعاً ينتهي بـ s نضع الفاصلة فقط: the boys\' bikes = دراجات الأولاد.' },
    { t: 'ex', items: [['My sister\'s name is Najma.', 'اسم أختي نجمة.'], ['Zakaria is my brother\'s friend.', 'زكريا صديق أخي.'], ['Our families are from Pakistan.', 'عائلاتنا من باكستان.'], ['Her name\'s Najma.', 'اسمها نجمة. (name\'s هنا = name is)']] },
    { t: 'tip', ar: 'انتبه! <b>its</b> = له (لغير العاقل) بدون فاصلة. أما <b>it\'s</b> فمعناها it is.' }
  ],
  game: {
    type: 'gap', title: 'Fill the gap', ar: 'اختر الكلمة الصحيحة لتكمل الجملة.',
    items: [
      { s: 'Hi, I\'m Zakaria. ___ friend is a bit younger than me.', o: ['My', 'Mine', 'I'] },
      { s: 'Mustafa lives in Sur with ___ family.', o: ['his', 'her', 'he'] },
      { s: 'That pink bag isn\'t mine. It\'s ___ .', o: ['hers', 'her', 'she'] },
      { s: 'We\'re Salim and Saleem. ___ families are from Pakistan.', o: ['Our', 'Ours', 'We'] },
      { s: 'Tom, is this red cap ___ ?', o: ['yours', 'your', 'you'] },
      { s: 'The twins live in London. That big house is ___ .', o: ['theirs', 'their', 'there'] },
      { s: 'Najma is ___ sister.', o: ['Mustafa\'s', 'Mustafas', 'Mustafas\''] }
    ]
  },
  quiz: [
    { q: 'Choose the correct word: "The dog wagged ___ tail."', o: ['its', 'it\'s', 'it is'], w: 'its = ملكية لغير العاقل. it\'s = it is.' },
    { q: '"This pen isn\'t mine. It\'s ___."', o: ['hers', 'her', 'she'], w: 'بعد It\'s لا يوجد اسم، لذلك نستخدم ضمير الملكية hers.' },
    { q: '"The girls\' books" means…', o: ['books that belong to more than one girl', 'books that belong to one girl', 'the girls are books'], w: 'الفاصلة بعد s تعني أن المالك جمع.' },
    { q: 'Where does Tom live?', o: ['Melbourne, Australia', 'New York', 'London'], w: 'Tom: "I\'m from Australia and I live in Melbourne."' },
    { q: 'Which word matches "we"?', o: ['our', 'their', 'your'], w: 'we ← our ← ours' },
    { q: 'Zakaria lives in…', o: ['Ibra', 'Sur', 'Muscat'], w: 'Zakaria: "I\'m from Oman and I live in Ibra."' }
  ]
});

LESSONS.push({
  id: 'u1l2', u: 'u1', title: 'Who am I?', ar: 'من أنا؟ الشكل والشخصية', pg: '2–3',
  intro: 'فهد يصف نفسه، ومقال يشرح ما الذي يجعل الناس مختلفين. نتعلم صفات الشكل وصفات الشخصية.',
  ex: [
    { t: 'rule', en: '<b>Adjectives</b> describe people. Some describe <b>appearance</b> (how you look), some describe <b>personality</b> (how you behave).', ar: 'الصفات تصف الناس. بعضها يصف <b>الشكل</b> (المظهر) وبعضها يصف <b>الشخصية</b> (الطبع والتصرف).' },
    { t: 'table', head: ['Appearance — الشكل', 'Personality — الشخصية'], rows: [['tall / short', 'kind / unkind'], ['slim / fat', 'friendly / rude'], ['bald / curly / blond', 'clever / lazy'], ['tidy / scruffy', 'honest / jealous'], ['handsome / pale', 'helpful / moody']] },
    { t: 'ex', items: [['I am 1 metre 60 centimetres tall and quite slim.', 'طولي متر و60 سم ونحيف نوعاً ما.'], ['My friends say I am friendly because I am always smiling.', 'أصدقائي يقولون إني ودود لأني دائماً مبتسم.'], ['Some people are quiet and shy.', 'بعض الناس هادئون وخجولون.']] },
    { t: 'rule', en: '<b>Writing about a person</b> — 5 paragraphs: 1 introduce the person, 2 appearance, 3 personality, 4 likes and dislikes, 5 family and things they have done.', ar: '<b>خطة الكتابة عن شخص</b> (5 فقرات): 1 التعريف (الاسم، العمر، المكان) 2 الشكل والملابس 3 الشخصية 4 ما يحب وما يكره 5 العائلة وإنجازاته.' },
    { t: 'tip', ar: 'من المقال: لا تحكم على شخصية أحد من شكله فقط! اللطف ومساعدة الآخرين يجلبان الأصدقاء.' }
  ],
  game: {
    type: 'sort', title: 'Sort the adjectives', ar: 'ضع كل صفة في المكان الصحيح: شكل أم شخصية؟',
    buckets: ['Appearance 👀', 'Personality 💭'],
    items: [['tall', 0], ['kind', 1], ['bald', 0], ['lazy', 1], ['blond', 0], ['jealous', 1], ['slim', 0], ['honest', 1], ['curly', 0], ['moody', 1], ['scruffy', 0], ['friendly', 1], ['pale', 0], ['helpful', 1]]
  },
  quiz: [
    { q: 'How old is Fahad?', o: ['15', '13', '19'], w: '"I am a teenager because I am 15 years old."' },
    { q: 'Where does Fahad live now?', o: ['Nizwa', 'Ibri', 'Muscat'], w: 'وُلد في عبري لكنه يعيش الآن في نزوى.' },
    { q: 'Why does Fahad want to be a doctor?', o: ['Because he wants to help people', 'Because he likes computers', 'Because his father is a doctor'], w: '"I hope one day to be a doctor because I want to help people."' },
    { q: 'Which adjective describes personality?', o: ['helpful', 'tall', 'curly'], w: 'helpful تصف التصرف (الشخصية)، والبقية تصف الشكل.' },
    { q: 'The opposite of "tidy" is…', o: ['untidy', 'tiny', 'clever'], w: 'tidy مرتب ← untidy غير مرتب (أو scruffy).' },
    { q: 'In "writing about a person", paragraph 2 is about…', o: ['what the person looks like', 'their family', 'their likes and dislikes'], w: 'الفقرة الثانية للشكل والملابس.' },
    { q: 'How are you more likely to make friends?', o: ['By being kind and helpful', 'By wearing smart clothes', 'By being angry'], w: 'من المقال: اللطف والمساعدة يجلبان الأصدقاء.' }
  ]
});

LESSONS.push({
  id: 'u1l3', u: 'u1', title: 'The Story of Prophet Yusuf (PBUH)', ar: 'قصة النبي يوسف عليه السلام', pg: '4',
  intro: 'نقرأ القصة بالإنجليزي ونتعلم الماضي البسيط وكلمات ترتيب الأحداث.',
  ex: [
    { t: 'rule', en: '<b>Past simple</b> tells a story in the past. Regular verbs add <b>-ed</b>: loved, dreamed, rescued. Many verbs are <b>irregular</b>.', ar: '<b>الماضي البسيط</b> نستخدمه لسرد القصص. الأفعال المنتظمة نضيف لها ed، وهناك أفعال شاذة تتغير.' },
    { t: 'table', head: ['Verb', 'Past simple', 'المعنى'], rows: [['have', 'had', 'كان لديه'], ['throw', 'threw', 'رمى'], ['take', 'took', 'أخذ'], ['sell', 'sold', 'باع'], ['see', 'saw', 'رأى'], ['become', 'became', 'أصبح'], ['give', 'gave', 'أعطى']] },
    { t: 'rule', en: '<b>Sequencing words</b> put events in order: One night… / One day… / The following day… / Then… / In the end…', ar: '<b>كلمات الترتيب</b> تربط أحداث القصة: في إحدى الليالي، في يوم من الأيام، في اليوم التالي، ثم، وفي النهاية.' },
    { t: 'ex', items: [['His eleven brothers were very jealous.', 'إخوته الأحد عشر كانوا يغارون منه كثيراً.'], ['One night, Yusuf had a strange dream.', 'في إحدى الليالي رأى يوسف حلماً غريباً.'], ['There would be seven years of famine.', 'ستأتي سبع سنوات من المجاعة.']] },
    { t: 'tip', ar: 'كلمات مهمة: <b>jealous</b> غيور — <b>dream</b> حلم — <b>famine</b> مجاعة — <b>ears of wheat</b> سنابل القمح — <b>caravan</b> قافلة.' }
  ],
  game: {
    type: 'order', title: 'Put the story in order', ar: 'رتّب أحداث القصة من البداية إلى النهاية. اضغط على الأحداث بالترتيب.',
    rounds: [{ words: ['His brothers became jealous.', 'Yusuf had a strange dream.', 'The brothers threw him into a well.', 'A caravan rescued him and took him to Egypt.', 'He was sent to prison.', 'He explained the King\'s dream.', 'He looked after the food stores.', 'His brothers found out he was their brother.'], block: true }]
  },
  quiz: [
    { q: 'What is the past simple of "throw"?', o: ['threw', 'throwed', 'thrown'], w: 'throw ← threw (فعل شاذ).' },
    { q: '"Famine" means…', o: ['a time when there is no food', 'a famous person', 'a big party'], w: 'famine = مجاعة.' },
    { q: 'How many brothers did Yusuf (PBUH) have who were jealous?', o: ['eleven', 'seven', 'nine'], w: '"This made his eleven brothers very jealous."' },
    { q: 'Why did the brothers soak the shirt in blood?', o: ['To make their father think a wolf ate Yusuf', 'To wash it', 'To sell it'], w: 'أرادوا أن يصدق أبوهم أن الذئب أكله.' },
    { q: 'What did the seven thin cows mean in the King\'s dream?', o: ['Seven years of famine', 'Seven rich years', 'Seven new kings'], w: 'سبع سنوات خصبة تليها سبع سنوات مجاعة.' },
    { q: 'Past simple of "sell" is…', o: ['sold', 'selled', 'sell'], w: 'sell ← sold.' }
  ]
});

LESSONS.push({
  id: 'u1l4', u: 'u1', title: 'Just hanging out?', ar: 'وقت الفراغ حول العالم', pg: '5',
  intro: 'مراهقون من أمريكا وبروناي وبريطانيا يحكون ماذا يفعلون في وقت فراغهم.',
  ex: [
    { t: 'rule', en: 'After <b>like, enjoy, love</b> we use <b>verb + -ing</b>: I really enjoy <b>going</b> ice-skating.', ar: 'بعد الأفعال <b>like / enjoy / love</b> نضع الفعل مع <b>ing</b>.' },

  if (!P.snd) return;

      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * .09;

      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.14, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + dur);

}

  const notes = [262, 294, 330, 392, 440, 523, 587, 659]; let step = 0;
  MUS = setInterval(() => {
    const t = actx.currentTime, play = (f, v, d, type) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .04); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + .05); };

  $('#panel').innerHTML = levelBar(G.l, n) + `<div class="donebox fade">${MASCOT(110)}<div class="big">${'⭐'.repeat(st)}</div><h3>${m === 0 ? 'Perfect! بدون أي خطأ!' : 'Well done! أنهيت المستوى ' + (n + 1)}</h3>
  <p style="color:var(--muted)">محاولات خاطئة: ${m}${first ? ' · +10 نقاط' : ''}${bonus ? ' · 🎉 أنهيت كل المستويات +20' : ''}</p>
  <div class="nextbar"><button class="btn ghost" onclick="startGame(lessonOf('${id}'),${n})">↺ العب مرة ثانية</button>
  ${n < 2 ? `<button class="btn" onclick="go('#/l/${id}/game/${n + 1}')">المستوى ${n + 2} ←</button>` : `<button class="btn" onclick="go('#/l/${id}/quiz')">إلى التحدي 🏆</button>`}</div></div>`;
}

/* ---------- auto games (from picture words) ---------- */
const BCOL = ['#F09E82', '#74B2E6', '#6FC9AE', '#A594E0'];
function drawAuto(g) {
  if (g.type === 'listen') {
    const R = G.rounds[G.i];
    return dots(G.rounds.length, G.i) + `<div class="listenbox"><button class="bigsay" data-say="${esc(R.p[1])}" onclick="sayEl(this)" aria-label="استمع">🔊</button><p class="hintar">اضغط السماعة لتسمع مرة ثانية</p></div>
      <div class="picopts">${R.opts.map((o, k) => `<button class="picopt" id="o${k}" onclick="autoPick(${k})">${o[0]}</button>`).join('')}</div>`;
  }
  if (g.type === 'balloons') {
    const R = G.rounds[G.i];
    return dots(G.rounds.length, G.i) + `<div class="prompt"><span class="em">${R.p[0]}</span>${sayBtn(R.p[1])}</div>
      <div class="sky">${R.opts.map((o, k) => `<button class="balloon" id="o${k}" style="--bc:${BCOL[k]};left:${3 + k * 24.5}%;animation-delay:${-k * 1.1}s;animation-duration:${3.2 + k * .4}s" onclick="autoPick(${k})"><span>${esc(o[1])}</span></button>`).join('')}
      <span class="cloud" style="top:14%;left:10%">☁️</span><span class="cloud" style="top:40%;left:70%">☁️</span></div>`;
  }
  if (g.type === 'spell') {
    const p = G.words[G.i], w = p[1].toLowerCase();
    return dots(G.words.length, G.i) + `<div class="prompt"><span class="em">${p[0]}</span><span class="pm">${p[2]}</span></div>
      <div class="slots">${w.split('').map((c, i) => `<span class="slot ${i < G.pos ? 'f' : ''}">${i < G.pos ? c : ''}</span>`).join('')}</div>
      <div class="chips">${G.tiles.map((t, j) => `<button class="chip tile ${t.used ? 'used' : ''}" id="t${j}" onclick="spellPick(${j})">${t.c}</button>`).join('')}</div>`;
  }
  if (g.type === 'rocket') {
    const p = G.words[G.i], w = p[1].toLowerCase(), fuel = 6 - G.wrong;
    return dots(G.words.length, G.i) + `<div class="rocketwrap"><div class="rk" id="rk">🚀</div><div class="fuel"><span style="height:${fuel / 6 * 100}%"></span></div><div class="prompt" style="margin:0"><span class="em">${p[0]}</span><span class="pm">${p[2]}</span></div></div>
      <div class="slots">${w.split('').map(c => `<span class="slot ${G.gs.has(c) ? 'f' : ''}">${G.gs.has(c) ? c : ''}</span>`).join('')}</div>
      <div class="keys">${'abcdefghijklmnopqrstuvwxyz'.split('').map(c => `<button class="key ${G.gs.has(c) ? (w.includes(c) ? 'good' : 'bad') : ''}" ${G.gs.has(c) ? 'disabled' : ''} onclick="rocketKey('${c}')">${c}</button>`).join('')}</div>`;
  }
  if (g.type === 'race') {
    const it = G.items[G.i];
    return dots(G.items.length, G.i) + `<div class="timer"><span id="tb"></span></div><div class="racecard"><span class="em">${it.e}</span><span class="w en">${esc(it.w)}</span></div>
      <div class="nextbar"><button class="btn" style="--c:var(--good)" onclick="raceAns(true)">✔ Yes نعم</button><button class="btn" style="--c:var(--bad)" onclick="raceAns(false)">✘ No لا</button></div>`;
  }
  return '';
}
function autoPick(k) {
  const R = G.rounds[G.i], o = R.opts[k], el = $('#o' + k); if (R.done) return;
  if (o[1] === R.p[1]) {
    R.done = true; el.classList.add(G.g.type === 'balloons' ? 'popped' : 'good'); if (G.g.type === 'balloons') sPop(); praise();
    if (G.g.type === 'balloons') say(R.p[1]);
    setTimeout(() => { G.i++; G.i >= G.rounds.length ? gameDone() : drawGame(); }, 900);
  } else { G.miss++; oops(); el.classList.add('bad'); el.disabled = true; if (G.g.type === 'balloons') el.classList.add('away'); }
}
function spellPick(j) {
  const t = G.tiles[j], w = G.words[G.i][1].toLowerCase(); if (t.used) return;
  if (t.c === w[G.pos]) {
    t.used = true; G.pos++; tone([500 + G.pos * 60], .07);
    if (G.pos === w.length) { drawGame(); praise(); say(w); setTimeout(() => { G.i++; if (G.i >= G.words.length) gameDone(); else { spellSet(); drawGame(); } }, 1000); }
    else drawGame();
  } else { G.miss++; sBad(); shakeEl($('#t' + j)); }
}
function rocketKey(c) {
  const w = G.words[G.i][1].toLowerCase(); if (G.gs.has(c) || G.busy) return; G.gs.add(c);
  if (w.includes(c)) {
    tone([620], .08); drawGame();
    if (w.split('').every(x => G.gs.has(x))) { G.busy = true; $('#rk').classList.add('launch'); sWhoosh(); praise(); say(w); setTimeout(() => { G.busy = false; G.i++; G.gs = new Set(); G.wrong = 0; G.i >= G.words.length ? gameDone() : drawGame(); }, 1400); }
  } else {
    G.wrong++; G.miss++; sBad(); drawGame();
    if (G.wrong >= 6) { G.busy = true; toast('💨', 'خلص الوقود! الكلمة: ' + w); say(w); setTimeout(() => { G.busy = false; G.i++; G.gs = new Set(); G.wrong = 0; G.i >= G.words.length ? gameDone() : drawGame(); }, 1800); }
  }
}
function raceTimer() {
  if (G.timer) clearTimeout(G.timer);
  const tb = $('#tb'); if (tb) { tb.style.transition = 'none'; tb.style.width = '100%'; void tb.offsetWidth; tb.style.transition = 'width 7s linear'; tb.style.width = '0%'; }
  const i = G.i; G.timer = setTimeout(() => { if (G.i === i && G.g.type === 'race') { G.miss++; sBad(); toast('⏰', 'خلص الوقت!'); raceNext(); } }, 7000);
}
function raceAns(v) {
  const it = G.items[G.i]; clearTimeout(G.timer);
  if (it.t === v) { G.score++; praise(); } else { G.miss++; oops(); toast('💡', `${it.e} = ${it.right}`); }
  raceNext();
}
function raceNext() { G.i++; if (G.i >= G.items.length) { G.timer = null; setTimeout(gameDone, 400); } else setTimeout(drawGame, 350); }

/* ================= quiz (lesson + final exam share engine) ================= */
let Q = null;
function prepQ(list) { return list.map(q => ({ ...q, ans: q.o[0], opts: shuffle(q.o) })); }
function startQuiz(l) { Q = { mode: 'lesson', l, list: prepQ(shuffle(l.quiz)), i: 0, score: 0, wrong: [], picked: null }; drawQ(); }
function drawQ() {
  const q = Q.list[Q.i], n = Q.list.length, box = Q.mode === 'exam' ? $('#exambox') : $('#panel');
  const pct = Math.round(Q.i / n * 100);
  const tag = Q.mode === 'exam' ? `<span class="pg" style="--c:${ucol(q.u)};margin:0">${unitOf(q.u).en}</span>` : '';
  box.innerHTML = `<div class="qtop"><span>سؤال ${Q.i + 1} من ${n}</span>${tag}<span>✔ ${Q.score}</span></div>
  <div class="progressline"><span style="width:${pct}%"></span></div>
  <div class="qtext">${esc(q.q)}</div>
  <div class="opts">${q.opts.map((o, k) => `<button class="opt" id="q${k}" onclick="qPick(${k})"><span class="L">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div>
  <div id="fb"></div>`;
}
function qPick(k) {
  if (Q.picked !== null) return; Q.picked = k;
  const q = Q.list[Q.i], ok = q.opts[k] === q.ans;
  q.opts.forEach((o, j) => { const b = $('#q' + j); b.disabled = true; if (o === q.ans) b.classList.add('good'); });
  if (ok) { Q.score++; praise(); } else { $('#q' + k).classList.add('bad'); Q.wrong.push({ ...q, mine: q.opts[k] }); oops(); }
  $('#fb').innerHTML = `<div class="feedback ${ok ? 'good' : 'bad'}"><span style="font-size:24px">${ok ? '🎉' : '💡'}</span><div><b>${ok ? 'إجابة صحيحة!' : 'الإجابة الصحيحة: <span class="en" style="display:inline">' + esc(q.ans) + '</span>'}</b>${q.w ? `<div style="color:var(--muted)">${q.w}</div>` : ''}</div></div>
  <div class="nextbar"><button class="btn" onclick="qNext()">${Q.i + 1 < Q.list.length ? 'السؤال التالي ←' : 'النتيجة 🏁'}</button></div>`;
}
function qNext() { Q.i++; Q.picked = null; if (Q.i >= Q.list.length) (Q.mode === 'exam' ? examResult() : quizResult()); else drawQ(); }
function reviewHTML(w) {
  if (!w.length) return '';
  return `<div class="review"><b>راجع هذه الأسئلة:</b>${w.map(x => `<div class="r"><div class="q">${esc(x.q)}</div><div class="c">✔ ${esc(x.ans)}</div>${x.w ? `<div style="color:var(--muted);font-size:15px">${x.w}</div>` : ''}</div>`).join('')}</div>`;
}
function quizResult() {
  const l = Q.l, pct = Math.round(Q.score / Q.list.length * 100), r = rec(l.id), was = (r.q || 0) >= 80;
  r.q = Math.max(r.q || 0, pct); if (!was && pct >= 80) addXP(30); save();
  if (pct >= 80) { sWin(); confetti(60); }
  const ls = lessonsIn(l.u), nx = ls[ls.indexOf(l) + 1];
  $('#panel').innerHTML = `<div class="donebox fade">${MASCOT(110)}<div class="score">${pct}%</div>
  <h3>${pct === 100 ? 'ممتاز! علامة كاملة 🏆' : pct >= 80 ? 'رائع! أتقنت الدرس ⭐' : pct >= 50 ? 'جيد! راجع الشرح وحاول مرة ثانية' : 'لا بأس! ارجع للشرح ثم جرّب من جديد 💪'}</h3>
  <p style="color:var(--muted)">${Q.score} من ${Q.list.length} صحيحة. تحتاج 80% لتحصل على نجمة الاختبار.</p>
  <div class="nextbar"><button class="btn ghost" onclick="startQuiz(lessonOf('${l.id}'))">↺ أعد الاختبار</button>
  ${pct < 80 ? `<button class="btn ghost" onclick="go('#/l/${l.id}/learn')">📖 راجع الشرح</button>` : ''}
  ${nx ? `<button class="btn" onclick="go('#/l/${nx.id}/learn')">الدرس التالي ←</button>` : `<button class="btn" onclick="go('#/u/${l.u}')">أنهيت الوحدة 🎉</button>`}</div>
  ${reviewHTML(Q.wrong)}</div>`;
}

/* ================= final exam ================= */
function viewExam() {
  app.innerHTML = `<div class="backrow"><button class="btn ghost small" onclick="go('#/')">→ الرئيسية</button></div>
  <section class="lessonhead fade" style="--c:var(--u2)"><span class="pg">Final Exam Practice</span><h1>الاختبار النهائي التجريبي 🏆</h1><div class="sub">6 أسئلة من كل وحدة — مفردات، قواعد، وفهم قراءة من الكتاب</div></section>
  <section class="panel fade" id="exambox" style="--c:var(--u2);margin-top:16px">
    <div class="donebox">${MASCOT(110)}<h3>هل أنت مستعد؟</h3>
    <p style="color:var(--muted);max-width:520px;margin:0 auto">ستظهر لك 30 سؤالاً بترتيب عشوائي. بعد كل سؤال ستعرف الإجابة الصحيحة، وفي النهاية تقرير يخبرك بقوتك في كل وحدة. كل مرة تبدأ ستأتيك أسئلة مختلفة!</p>
    <div class="nextbar"><button class="btn" style="--c:var(--sun)" onclick="startExam()">ابدأ الآن 🚀</button></div>
    ${P.examBest != null ? `<p style="color:var(--muted)">أفضل نتيجة سابقة: <b>${P.examBest}%</b></p>` : ''}</div>
  </section>`;
}
function startExam() {
  let list = [];
  UNITS.forEach(u => { const pool = shuffle(lessonsIn(u.id).flatMap(l => l.quiz.map(q => ({ ...q, u: u.id })))); list = list.concat(pool.slice(0, 6)); });
  Q = { mode: 'exam', list: prepQ(shuffle(list)), i: 0, score: 0, wrong: [], picked: null };
  drawQ();
}
function examResult() {
  const n = Q.list.length, pct = Math.round(Q.score / n * 100);
  const first = P.examBest == null || P.examBest < 80;
  P.examBest = Math.max(P.examBest || 0, pct); if (pct >= 80 && first) addXP(50); save();
  const per = UNITS.map(u => { const all = Q.list.filter(q => q.u === u.id).length, bad = Q.wrong.filter(q => q.u === u.id).length; return { u, all, ok: all - bad, p: all ? Math.round((all - bad) / all * 100) : 0 }; });
  const weak = per.filter(x => x.p < 70);
  if (pct >= 80) { sWin(); confetti(80); }
  const grade = pct >= 90 ? 'ممتاز — أنت جاهز للاختبار النهائي! 🏆' : pct >= 75 ? 'جيد جداً — راجع الوحدات الضعيفة وستكون جاهزاً ⭐' : pct >= 50 ? 'جيد — تحتاج مراجعة بعض الدروس 💪' : 'ابدأ بمراجعة الشرح والألعاب ثم أعد المحاولة 📖';
  $('#exambox').innerHTML = `<div class="donebox fade">${MASCOT(110)}<div class="score">${pct}%</div><h3>${grade}</h3><p style="color:var(--muted)">${Q.score} من ${n} إجابة صحيحة</p>
  <div class="bars">${per.map(x => `<div class="barrow"><span class="en" style="text-align:right">${x.u.en}</span><span class="track"><span style="width:${x.p}%;background:var(--${x.u.id})"></span></span><b>${x.ok}/${x.all}</b></div>`).join('')}</div>
  ${weak.length ? `<p>📌 ننصحك بمراجعة: ${weak.map(x => `<button class="btn small" style="--c:var(--${x.u.id});margin:4px" onclick="go('#/u/${x.u.id}')">${x.u.ar}</button>`).join('')}</p>` : '<p>👏 أداؤك قوي في كل الوحدات!</p>'}
  <div class="nextbar"><button class="btn" style="--c:var(--sun)" onclick="startExam()">↺ اختبار جديد</button><button class="btn ghost" onclick="go('#/')">الرئيسية</button></div>
  ${reviewHTML(Q.wrong)}</div>`;
}

/* ================= boot ================= */
$('#snd').textContent = P.snd ? '🔊' : '🔇';
save();
if ('speechSynthesis' in window) speechSynthesis.getVoices();
render();

</script>
</body>
</html>
